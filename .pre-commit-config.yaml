default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--enforce-all]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4  # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock is current
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
      - id: bun-lock
        name: bun.lock is current
        entry: bun install --frozen-lockfile
        language: system
        files: ^(package\.json|bun\.lock)$
        pass_filenames: false
      - id: pyproject-fmt
        name: pyproject-fmt
        entry: uv run pyproject-fmt pyproject.toml
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: false
        always_run: true
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest, 100% branch coverage
        entry: uv run pytest --cov
        language: system
        pass_filenames: false
        always_run: true
      - id: actionlint
        name: actionlint
        entry: uv run actionlint
        language: system
        pass_filenames: false
        always_run: true
      - id: zizmor
        name: zizmor
        entry: uv run zizmor .
        language: system
        pass_filenames: false
        always_run: true
      - id: biome
        name: biome
        entry: bunx biome ci
        language: system
        pass_filenames: false
        always_run: true
      - id: tsc
        name: tsc
        entry: bunx tsc -p tsconfig.json
        language: system
        pass_filenames: false
        always_run: true
      - id: bun-test
        name: bun test, 100% coverage
        entry: bun test
        language: system
        pass_filenames: false
        always_run: true
      - id: nustack-check
        name: nustack check
        entry: uv run nustack check
        language: system
        pass_filenames: false
        always_run: true
      - id: conventional-commit
        name: Conventional Commits
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
