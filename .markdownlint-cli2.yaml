# Rules: https://github.com/DavidAnson/markdownlint/blob/v0.42.0/doc/Rules.md
config:
  # Each paragraph and list entry keeps to one line, so a diff shows the
  # sentence that changed instead of a rewrapped block.
  MD013: false
  # Each CHANGELOG.md release repeats the section headings Keep a Changelog
  # names, such as Added: https://keepachangelog.com/en/1.1.0/
  MD024:
    siblings_only: true
  MD060:
    style: compact
# The first-line title rule skips only the files that cannot open on a title:
# https://github.com/DavidAnson/markdownlint/blob/v0.42.0/doc/md041.md
# The PR template opens on the comment and centered header a description starts
# from, where an inline disable comment would land in every description, and
# CLAUDE.md is a single import line: https://github.com/DavidAnson/markdownlint-cli2/tree/v0.24.0#overrides
overrides:
  - filter:
      - .github/pull_request_template.md
      - CLAUDE.md
    config:
      MD041: false
      # The template centers its header and folds its detail with the HTML
      # GitHub renders in a description.
      MD033:
        allowed_elements:
          - details
          - div
          - sub
          - summary
    combine: merge
  # README.md's front page centres its title, tagline and links, folds its
  # skills tables and shows the wordmark for the reader's theme, which only
  # HTML does on GitHub:
  # https://docs.github.com/en/get-started/writing-on-github/getting-started-with-writing-and-formatting-on-github/basic-writing-and-formatting-syntax#specifying-the-theme-an-image-is-shown-to
  - filter:
      - README.md
    config:
      MD033:
        allowed_elements: [a, br, details, h1, img, p, picture, source, summary]
    combine: merge
