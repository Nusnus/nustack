# https://bun.com/docs/runtime/bunfig#test-runner
[test]
root = "tests"
# bun test has no setting that fails on a warning
# (https://bun.com/docs/runtime/bunfig#test-runner), so this file fails the
# test that warns.
preload = [ "./tests/fixtures/warnings.ts" ]
# The smoke tests run real hosts, so they run alone: make smoke.
pathIgnorePatterns = [ "tests/smoke/**" ]
# Prints the seed of each run; rerun one order with bun test --seed=<seed>.
randomize = true
