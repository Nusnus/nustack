name: CI

# Checks each pull request and each push to main. Release calls it too, so a
# tag publishes only after the same checks pass on it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions: {}

# An explicit bash adds -o pipefail, so a piped command fails its step:
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
defaults:
  run:
    shell: bash

# A pull request's runs replace each other. Each push to main runs alone, since
# GitHub cancels a run still waiting in a group when another joins it:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - if: github.event_name == 'pull_request'
        name: Each commit on the pull request, but those the squash merge drops
        run: uv run --locked cz check --rev-range "$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      # Every commit up to the pushed one, not the pushed range: after a
      # force-push the old head is no longer in the checkout, so a range from it
      # can't be read
      # (https://docs.github.com/en/webhooks/webhook-events-and-payloads#push).
      # A workflow that release calls runs under release's push event, since a
      # called workflow takes its caller's github context
      # (https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations#github-context),
      # so it checks every commit up to the tagged one too.
      - if: github.event_name == 'push'
        name: Every commit up to the pushed one
        run: uv run --locked cz check --allowed-prefixes --rev-range "$GITHUB_SHA"
      - if: github.event_name != 'pull_request' && github.event_name != 'push'
        name: An event with no commit check
        run: |
          echo "::error::CI checks commits on pull_request and push, not $EVENT; add a step for it"
          exit 1
        env:
          EVENT: ${{ github.event_name }}
    timeout-minutes: 5

  make-check:
    name: make check
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: make check
        run: |
          status=0
          # Only CI shows the hooks' diff: pre-commit prints a plain git diff
          # (https://github.com/pre-commit/pre-commit/blob/v4.7.0/pre_commit/commands/run.py#L304-L319),
          # which holds only the hooks' changes on a fresh checkout, but locally
          # would also hold your own edits.
          make check PRE_COMMIT_FLAGS=--show-diff-on-failure 2>&1 | tee check.log || status=$?
          {
            echo '### make check'
            echo
            echo '<pre>'
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' check.log
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
    timeout-minutes: 15

  release-zip:
    name: Release zip
    needs: make-check
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The release publishes this job's zip and page, so it reads no cache another workflow could have written:
      # https://docs.zizmor.sh/audits/#cache-poisoning
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          no-cache: true
      - name: Install the scripts' packages from bun.lock
        run: bun install --frozen-lockfile
      - name: Build the zip and the release page
        run: |
          make bundle
          bun scripts/release.ts notes > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
    timeout-minutes: 5

  smoke:
    name: make smoke
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - name: make smoke
        run: make smoke
    # The smoke tests may each take make smoke's --timeout (Makefile), after the
    # hosts' uncached install.
    timeout-minutes: 30
