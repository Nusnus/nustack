name: Release

# Publishes the GitHub release for a v<version> tag on main, once the tag
# matches the plugin version and CI passes on it. The release skill,
# .agents/skills/release/SKILL.md, says how to cut one.
on:
  push:
    tags: ["v*"]

permissions: {}

defaults:
  run:
    shell: bash

# A tag pushed again waits for the release still publishing from it:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  tag:
    name: Tag
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: The tag is on main and names the plugin version
        run: uv run --locked nustack release-tag "$GITHUB_REF_NAME"
    timeout-minutes: 5

  ci:
    name: CI
    permissions:
      contents: read
    needs: tag
    uses: $/.github/workflows/ci.yml

  publish:
    name: Publish
    permissions:
      contents: write
    needs: ci
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # gh takes its host from GH_HOST, not from the server the workflow runs on
      # (https://cli.github.com/manual/gh_help_environment). The $/ call above
      # keeps this workflow off Enterprise Server
      # (https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows),
      # so it sets no Enterprise token.
      - name: Publish the release
        run: |
          export GH_HOST=${GITHUB_SERVER_URL#https://}
          uv run --locked nustack publish "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --name-with-owner "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
    timeout-minutes: 5
