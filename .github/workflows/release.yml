name: Release

# Publishes the GitHub release for a v<version> tag on main, once the tag
# matches the plugin version and CI passes on it. The release skill,
# .agents/skills/release/SKILL.md, says how to cut one.
on:
  push:
    tags: ["v*"]

permissions: {}

defaults:
  run:
    shell: bash

# A tag pushed again waits for the release still publishing from it:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  tag:
    name: Tag
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A release reads no cache another workflow could have written:
      # https://docs.zizmor.sh/audits/#cache-poisoning
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          no-cache: true
      - name: Install the scripts' packages from bun.lock
        run: bun install --frozen-lockfile
      - name: The tag is on main and names the plugin version
        run: bun scripts/release.ts verify-tag "$GITHUB_REF_NAME"
    timeout-minutes: 5

  ci:
    name: CI
    permissions:
      contents: read
    needs: tag
    uses: $/.github/workflows/ci.yml

  publish:
    name: Publish
    permissions:
      contents: write
    needs: ci
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          no-cache: true
      - name: Install the scripts' packages from bun.lock
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: dist
      # gh takes its host from GH_HOST, not from the server the workflow runs on
      # (https://cli.github.com/manual/gh_help_environment). The $/ call above
      # keeps this workflow off Enterprise Server
      # (https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows),
      # so it sets no Enterprise token. GITHUB_SHA is the commit the tag named
      # when it was pushed, the one CI passed on, and publish publishes only
      # while the tag still names it. zizmor reads `bun ... publish` as a
      # package registry upload, which trusted publishing would replace; this
      # one publishes a GitHub release, so the audit does not apply.
      - name: Publish the release
        run: |  # zizmor: ignore[use-trusted-publishing]
          export GH_HOST=${GITHUB_SERVER_URL#https://}
          bun scripts/release.ts publish "$GITHUB_REF_NAME" "$GITHUB_SHA"
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
    timeout-minutes: 5
