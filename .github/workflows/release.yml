name: Release

# Publishes the release a merged release pull request names, as .agents/skills/release/SKILL.md says. A push to
# main that leaves the version released publishes nothing.
on:
  push:
    branches: [main]
    paths: [plugin/.claude-plugin/plugin.json]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  publish:
    name: Publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release reads no cache another workflow could have written.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Publish the release
        run: bun scripts/release.ts publish
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
    timeout-minutes: 10
