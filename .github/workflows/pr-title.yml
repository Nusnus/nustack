name: PR title

# The squash merge makes the title the commit on main, as AGENTS.md › Pull
# requests says, so the title is held to Conventional Commits with no
# exemptions. Its own workflow lets an edit rerun this check alone. No filter
# tells a title edit from a body edit, so GitHub starts a run on every edit
# (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onevent_nametypes),
# and each run checks the title: a skipped job reports success
# (https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

defaults:
  run:
    shell: bash

# A newer run waits for the one in progress, which finishes rather than leaving
# a cancelled check, and replaces any run still waiting:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  conventional-commit:
    name: Conventional Commit
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-26.04
    steps:
      # Since every edit starts a run, this step deletes the pull request's
      # earlier runs for its commit, leaving one PR title check. The concurrency
      # group above lets each earlier run finish before this one starts, and
      # each new run of a workflow takes the next run number
      # (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#github-context),
      # so a run with a lower number is an earlier one. Every page is listed
      # before any run is deleted, since a deletion would shift the later pages.
      # A fork's token cannot delete runs
      # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#how-permissions-are-calculated-for-a-workflow-job),
      # so a fork's pull request keeps its earlier runs.
      # gh takes its host from GH_HOST, not from the server the workflow runs
      # on, and its token for an Enterprise Server host from GH_ENTERPRISE_TOKEN
      # (https://cli.github.com/manual/gh_help_environment).
      - if: github.event.pull_request.head.repo.full_name == github.repository
        name: Delete the earlier runs for this commit
        run: |
          export GH_HOST=${GITHUB_SERVER_URL#https://}
          workflow=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq ".workflow_runs[] | select(.run_number < $GITHUB_RUN_NUMBER and .status == \"completed\" and any(.pull_requests[]; .number == $PR)) | .id")
          for run in $runs; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run"
          done
        env:
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: The title is a Conventional Commit
        run: uv run --locked cz check --allowed-prefixes --message "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
    timeout-minutes: 5
