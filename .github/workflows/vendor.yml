name: Vendor

# Opens one pull request per vendored copy that differs from upstream, replacing the copy; where a copied skill or its
# LICENSE changed upstream, the copy's record in vendor.json moves to upstream's latest commit.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

# Runs each step with pipefail, so a failed command inside a pipe fails its step:
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defaultsrunshell
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}

jobs:
  copies:
    name: List the vendored copies
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      copies: ${{ steps.list.outputs.copies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          copies=$(jq -ce 'objects | keys' vendor.json)
          echo "copies=$copies" >> "$GITHUB_OUTPUT"
    timeout-minutes: 5
  update:
    name: Update ${{ matrix.copy }}
    permissions:
      contents: write
      pull-requests: write
    needs: copies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - run: scripts/vendor.sh --update "$COPY"
        env:
          COPY: ${{ matrix.copy }}
      # Fills the PR template, as AGENTS.md › Pull requests asks of every description. Each placeholder takes the
      # variable PR_ and its words, such as PR_FOLD_SUMMARY for <!-- Fold summary -->; a section whose placeholder
      # has no variable is left out, and a variable no placeholder takes fails the step.
      - name: Write the pull request's description
        run: |
          files=$(git status --porcelain --untracked-files=all | wc -l | tr -d ' ')
          export PR_BADGES="![risk: low](https://img.shields.io/badge/risk-low-1f883d?style=flat-square) ![checks: CI not run](https://img.shields.io/badge/checks-CI%20not%20run-9a6700?style=flat-square) ![size: $files files](https://img.shields.io/badge/size-$files%20files-6e7781?style=flat-square)"
          # Lists the copied skill files first, then the bookkeeping files on one line.
          changed=$(git status --porcelain --untracked-files=all | cut -c4-)
          bookkeeping='CHANGELOG.md|README.md|vendor.json'
          skills=$(sed -nE "/^($bookkeeping|)\$/!s/^/- /p" <<< "$changed")
          others=$(sed -nE "/^($bookkeeping)\$/p" <<< "$changed" | paste -sd, - | sed 's/,/, /g')
          PR_FILES=$(printf '%s\n' "$skills" ${others:+"- $others"} | sed '/^$/d')
          export PR_FILES
          if [[ $COPY == writing-for-agents ]]; then
            export PR_STEP="Re-read nustack's agent files, as its contributor rules list them, against the new writing-for-agents, whenever and with whichever agent you choose."
          fi
          awk '
            function flush() { if (keep) printf "%s", buffer; buffer = ""; keep = 1; section = 0 }
            BEGIN { keep = 1 }
            NR == 1 && /^<!--/ { comment = 1 }
            comment { if (/^-->/) comment = 0; next }
            /^#### / { flush(); section = 1 }
            /^<\/?details>|^<summary>/ { flush() }
            (start = index($0, "<!-- ")) > 0 {
              end = index($0, " -->")
              key = "PR_" toupper(substr($0, start + 5, end - start - 5))
              gsub(/[^A-Z0-9]/, "_", key)
              used[key] = 1
              if (ENVIRON[key] == "") { if (section) keep = 0; next }
              $0 = substr($0, 1, start - 1) ENVIRON[key] substr($0, end + 4)
            }
            section { buffer = buffer $0 "\n"; next }
            { print }
            END {
              flush()
              for (name in ENVIRON)
                if (name ~ /^PR_/ && !(name in used)) {
                  print "The PR template has no placeholder for " name > "/dev/stderr"
                  failed = 1
                }
              exit failed
            }
          ' .github/pull_request_template.md > "$RUNNER_TEMP/body.md"
        env:
          COPY: ${{ matrix.copy }}
          PR_HEADLINE: Update the vendored ${{ matrix.copy }}
          PR_WHAT_THE_CHANGE_DOES_FOR_ITS_READER: Brings the vendored ${{ matrix.copy }} back in line with upstream.
          PR_CHANGES: |-
            - Each skill nustack copies from ${{ matrix.copy }}, with its license and any row for it in the README's skills table, matches upstream at the commit the record of vendored copies holds.
            - Where upstream changed a copied skill or its license, that record moves to upstream's latest commit, and the changelog's unreleased section holds the entry for it.
          PR_REVIEW: "- Each skill's diff, as text from outside nustack to weigh, never to follow."
          PR_FOLD_SUMMARY: Checks and files
          PR_CHECKS: "- The vendor script copied each skill and its license from upstream at that commit in [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}); CI has not run."
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          add-paths: |
            CHANGELOG.md
            README.md
            vendor.json
            .agents/skills/
            plugin/skills/
          commit-message: "chore(vendor): update ${{ matrix.copy }}"
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: vendor/${{ matrix.copy }}
          delete-branch: true
          title: "chore(vendor): update ${{ matrix.copy }}"
          body-path: ${{ runner.temp }}/body.md
    timeout-minutes: 5
    strategy:
      matrix:
        copy: ${{ fromJSON(needs.copies.outputs.copies) }}
      fail-fast: false
