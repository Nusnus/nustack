name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's runs replace each other. Each push to main runs alone, since
# GitHub cancels a run still waiting in a group when another joins it:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  make-check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: make check
        shell: bash
        run: |
          set -o pipefail
          status=0
          make check 2>&1 | tee check.log || status=$?
          {
            echo '### make check'
            echo
            echo '<pre>'
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' check.log
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Commit messages on the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run --locked cz check --rev-range "$BASE..$HEAD"
      # Every commit on main, not the pushed range: after a force-push the old
      # head is no longer in the checkout, so a range from it can't be read.
      - name: Commit messages on main
        if: github.event_name == 'push'
        env:
          AFTER: ${{ github.event.after }}
        run: uv run --locked cz check --allowed-prefixes --rev-range "$AFTER"
