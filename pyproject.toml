# uv pins nustack's Python tools; nustack holds no Python code. cz bump sets the
# version here and in uv.lock, through the uv provider, and in each manifest.
[project]
name = "nustack"
version = "0.0.2"
requires-python = ">=3.15"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "commitizen>=4.19.3",
  "pre-commit>=4.7",
  # actionlint checks workflow scripts with ShellCheck only when it is
  # installed, and the shellcheck hook runs it:
  # https://github.com/rhysd/actionlint/blob/v1.7.12/docs/checks.md#check-shellcheck-integ
  "shellcheck-py>=0.11.0.1",
  "zizmor>=1.31.1",
]

# https://commitizen-tools.github.io/commitizen/config/bump/
[tool.commitizen]
# The release workflow publishes from a v<version> tag.
tag_format = "v$version"
version_files = [
  "plugin/.claude-plugin/plugin.json:version",
  "plugin/.cursor-plugin/plugin.json:version",
  "plugin/.devin-plugin/plugin.json:version",
  "plugin/package.json:version",
]
version_provider = "uv"

[tool.uv]
# The newest uv that Dependabot's own uv meets, not the oldest that locks
# this project:
# https://github.com/dependabot/dependabot-core/blob/v0.403.0/uv/helpers/requirements.txt
required-version = ">=0.13.5"
