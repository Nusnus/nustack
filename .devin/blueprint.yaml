# The Devin environment for nustack. AGENTS.md › Environment says how it works and how to change it.
maintenance:
  - name: uv and Bun, where the machine lacks them
    run: |
      set -euo pipefail
      if ! command -v uv >/dev/null; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
        sudo ln -sf "$HOME/.local/bin/uv" /usr/local/bin/uv
      fi
      if ! command -v bun >/dev/null; then
        curl -fsSL https://bun.sh/install | bash
        sudo ln -sf "$HOME/.bun/bin/bun" /usr/local/bin/bun
        sudo ln -sf "$HOME/.bun/bin/bun" /usr/local/bin/bunx
      fi
  - name: The harness, the loader's tools, the commit hooks and their environments
    run: |
      set -euo pipefail
      make install
      uv run pre-commit install-hooks
knowledge:
  - name: check
    contents: make check
  - name: build
    contents: make bundle
