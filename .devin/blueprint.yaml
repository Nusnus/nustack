# The Devin environment for nustack: the same steps build a Linux and a macOS machine.
# Other repositories share these machines, so each tool installs only where missing.
maintenance:
  - name: Bun and jq where missing, then the packages bun.lock pins
    run: |
      set -euo pipefail
      if ! command -v bun >/dev/null; then
        # Downloads Bun's release itself, since Bun's install script downloads it with no time limit and no retry.
        # Reads the platform in an assignment, which fails with uname, where a case word runs on with nothing:
        # https://www.gnu.org/software/bash/manual/html_node/Simple-Command-Expansion.html
        platform=$(uname -sm)
        case $platform in
          "Linux x86_64") target=linux-x64-baseline ;;
          "Linux aarch64") target=linux-aarch64 ;;
          "Darwin x86_64") target=darwin-x64-baseline ;;
          "Darwin arm64") target=darwin-aarch64 ;;
          *) echo "Bun has no build for $platform" >&2; exit 1 ;;
        esac
        tag=bun-v1.4.4
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        mkdir -p "$HOME/.bun/bin"
        download() { curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 "$@"; }
        # GitHub's release downloads can return 504 for longer than curl's retries last, so the same build comes from npm instead.
        if download -o "$work/bun.zip" "https://github.com/oven-sh/bun/releases/download/$tag/bun-$target.zip"; then
          unzip -oqj "$work/bun.zip" -d "$HOME/.bun/bin"
        else
          # A status of 126 or more is the shell's, for a curl it cannot run or a signal kills, and stops the step:
          # https://www.gnu.org/software/bash/manual/html_node/Exit-Status.html
          failure=$?
          (( failure < 126 )) || exit "$failure"
          echo "Bun's GitHub release failed to download; downloading the same build from npm" >&2
          download "https://registry.npmjs.org/@oven/bun-$target/-/bun-$target-${tag#bun-v}.tgz" |
            tar -xzf - -C "$HOME/.bun/bin" --strip-components=2 package/bin/bun
        fi
        # bunx is Bun run under that name, a link Bun's install script makes too.
        ln -sf bun "$HOME/.bun/bin/bunx"
        sudo mkdir -p /usr/local/bin
        sudo ln -sf "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx" /usr/local/bin/
      fi
      if ! command -v jq >/dev/null; then
        if command -v brew >/dev/null; then brew install jq; else sudo apt-get update; sudo apt-get install -y jq; fi
      fi
      bun install --frozen-lockfile
runs-on: [default, macos]
