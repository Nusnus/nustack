# The Devin environment for nustack: the same steps build a Linux and a macOS machine.
# Other repositories share these machines, so each tool installs only where missing.
maintenance:
  - name: Bun and jq where missing, then the packages bun.lock pins
    run: |
      set -u
      if ! command -v bun >/dev/null; then
        curl -fsSL --retry 3 https://bun.sh/install | bash -s bun-v1.4.4
        sudo mkdir -p /usr/local/bin
        sudo ln -sf "$HOME/.bun/bin/bun" /usr/local/bin/
      fi
      if ! command -v jq >/dev/null; then
        if command -v brew >/dev/null; then brew install jq; else sudo apt-get update && sudo apt-get install -y jq; fi
      fi
      bun install --frozen-lockfile
knowledge:
  - name: test
    contents: bun run check runs every check in seconds; bun run hosts installs the plugin in the latest Claude Code and OpenCode and checks each offers every skill
  - name: release
    contents: follow .agents/skills/release/SKILL.md, for a release or a dry run
runs-on: [default, macos]
